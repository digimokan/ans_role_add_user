# add users, as required:
#   user_name = name of user
#   is_system_user = whether user is "system" user (user with UID >= 1000)
#   password = when set, the role will set/update the password, and when
#              empty string, the role will check if a password has already
#              been set
#   primary_group = user's primary group
#   groups = make user member of ONLY these groups (not affect primary group)
#   create_home_dir_in_existing_filesystem = on user creation, create
#                                            /home/user2 directory in the
#                                            existing filesystem
#   path_to_home_dir = set the path to the user's home dir in the
#                      `/user/password` file
#   comment = _GECOS_ field in `/user/password`, used by apps such as LightDM
cfg_users_to_add: []
